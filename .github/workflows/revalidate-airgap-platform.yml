name: Revalidate Airgap Platform (non-publishing)
# Runs the full airgap-platform bundle build on the official builder to confirm
# the release-capable path still works. Does NOT publish any official artifacts.
# Use this after infrastructure changes, runner migrations, or to satisfy the
# ADR-0008 revalidation requirement.
#
# For an actual official republish, touch release/REVALIDATION_TRIGGER in a PR instead.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # Weekly, Sunday 04:00 UTC (staggered after matchbox revalidation)

permissions:
  contents: read

concurrency:
  group: revalidate-airgap-platform-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: [self-hosted, official-heavy, airgap-builder]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR (for pulling upstream platform images)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build airgap bundle (no publish)
        env:
          ARCH: ${{ matrix.arch }}
          CONTAINER_CLI: podman
        run: |
          set -euo pipefail
          ARCH="${ARCH}" ./tools/airgap-platform/build.sh

      - name: Verify bundle layout
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          test -f dist/airgap-platform.tar.gz

          TAR_LIST="/tmp/airgap-platform-revalidate-${ARCH}.list"
          tar -tzf dist/airgap-platform.tar.gz > "${TAR_LIST}"

          echo "Tar listing (head):"
          sed -n '1,50p' "${TAR_LIST}"

          grep -q '^k3s/k3s$' "${TAR_LIST}"
          grep -q "^k3s/k3s-airgap-images-${ARCH}\\.tar$" "${TAR_LIST}"
          grep -q '^manifest.env$' "${TAR_LIST}"
          grep -q '^platform/images/' "${TAR_LIST}"

          echo "Bundle layout verified for ${ARCH}."

      - name: Upload revalidation metadata
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revalidation-airgap-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            dist/airgap-platform.meta.env
          if-no-files-found: warn
