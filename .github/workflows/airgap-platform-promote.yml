name: Airgap Platform Promote Release

on:
  workflow_run:
    workflows: ["Airgap Platform"]
    types: [completed]
  release:
    types: [published, prereleased]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: airgap-platform-promote-${{ github.event.release.tag_name || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  promote:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        promotion_context: [stable, exp-labs]

    steps:
      - name: Checkout candidate revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout release tag
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve promotion context
        id: context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          PROMOTION_CONTEXT: ${{ matrix.promotion_context }}
          CANDIDATE_WORKFLOW_NAME: Airgap Platform
        run: |
          set -euo pipefail
          ./tools/release-control/resolve-promotion-context.sh \
            "${PROMOTION_CONTEXT}" \
            "${CANDIDATE_WORKFLOW_NAME}" \
            "${GITHUB_OUTPUT}"

      - name: Download candidate provenance
        if: steps.context.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: airgap-platform-${{ matrix.arch }}-${{ steps.context.outputs.candidate_run_id }}
          path: dist/candidate-provenance/${{ matrix.arch }}
          run-id: ${{ steps.context.outputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digest into release tag
        if: steps.context.outputs.skip != 'true'
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
          PROMOTION_CONTEXT: ${{ matrix.promotion_context }}
        run: |
          set -euo pipefail
          source_ref_file="$(find "dist/candidate-provenance/${ARCH}" -type f -name "airgap-platform.${ARCH}.ref" | head -n1 || true)"
          [[ -f "${source_ref_file}" ]] || {
            echo "Missing airgap-platform.${ARCH}.ref in downloaded candidate provenance" >&2
            exit 1
          }
          publish_record_file="$(find "dist/candidate-provenance/${ARCH}" -type f -name "airgap-platform.${ARCH}.publish-record.json" | head -n1 || true)"
          [[ -f "${publish_record_file}" ]] || {
            echo "Missing airgap-platform.${ARCH}.publish-record.json in downloaded candidate provenance" >&2
            exit 1
          }

          mkdir -p "dist/promote/${ARCH}"
          export PROMOTE_SOURCE_REF="$(cat "${source_ref_file}")"
          export PROMOTE_SOURCE_PINNED_REF="${PROMOTE_SOURCE_REF}"

          ./tools/airgap-platform/promote.sh "${ARCH}" "${PROMOTION_CONTEXT}"
          cp "dist/airgap-platform.${ARCH}.promote.source.ref" "dist/promote/${ARCH}/${PROMOTION_CONTEXT}.source.ref"
          cp "dist/airgap-platform.${ARCH}.promote.digest.ref" "dist/promote/${ARCH}/${PROMOTION_CONTEXT}.digest.ref"
          cp "dist/airgap-platform.${ARCH}.promote.target.ref" "dist/promote/${ARCH}/${PROMOTION_CONTEXT}.target.ref"

          ./tools/airgap-platform/promote.sh "${ARCH}" "${RELEASE_TAG}"
          cp "dist/airgap-platform.${ARCH}.promote.source.ref" "dist/promote/${ARCH}/versioned.source.ref"
          cp "dist/airgap-platform.${ARCH}.promote.digest.ref" "dist/promote/${ARCH}/versioned.digest.ref"
          cp "dist/airgap-platform.${ARCH}.promote.target.ref" "dist/promote/${ARCH}/versioned.target.ref"

          ./tools/airgap-platform/update-catalog.sh \
            "${publish_record_file}" \
            "${PROMOTION_CONTEXT}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${RELEASE_TAG}-${ARCH}" \
            "${RELEASE_TAG}"

      - name: Upload promote outputs
        uses: actions/upload-artifact@v4
        if: steps.context.outputs.skip != 'true' && always()
        with:
          name: airgap-platform-promote-${{ matrix.arch }}-${{ matrix.promotion_context }}-${{ steps.context.outputs.release_tag || github.run_id }}
          path: |
            dist/promote/${{ matrix.arch }}/${{ matrix.promotion_context }}.source.ref
            dist/promote/${{ matrix.arch }}/${{ matrix.promotion_context }}.digest.ref
            dist/promote/${{ matrix.arch }}/${{ matrix.promotion_context }}.target.ref
            dist/promote/${{ matrix.arch }}/versioned.source.ref
            dist/promote/${{ matrix.arch }}/versioned.digest.ref
            dist/promote/${{ matrix.arch }}/versioned.target.ref
          if-no-files-found: warn
