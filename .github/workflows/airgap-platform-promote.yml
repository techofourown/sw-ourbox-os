name: Airgap Platform Promote Release

on:
  workflow_run:
    workflows: ["Airgap Platform"]
    types: [completed]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: airgap-platform-promote-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve authorized release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(./tools/resolve-promotable-release.sh versioned "${{ github.event.workflow_run.head_sha }}" || true)"
          if [[ -z "${tag}" ]]; then
            echo "No published release found for candidate commit ${{ github.event.workflow_run.head_sha }}; skipping."
            exit 0
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download candidate provenance
        if: steps.release.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          name: airgap-platform-${{ matrix.arch }}-${{ github.event.workflow_run.id }}
          path: dist/candidate-provenance/${{ matrix.arch }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digest into release tag
        if: steps.release.outputs.tag != ''
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          source_ref_file="$(find "dist/candidate-provenance/${ARCH}" -type f -name "airgap-platform.${ARCH}.ref" | head -n1 || true)"
          [[ -f "${source_ref_file}" ]] || {
            echo "Missing airgap-platform.${ARCH}.ref in downloaded candidate provenance" >&2
            exit 1
          }
          export PROMOTE_SOURCE_REF="$(cat "${source_ref_file}")"
          export PROMOTE_SOURCE_PINNED_REF="${PROMOTE_SOURCE_REF}"
          ./tools/airgap-platform/promote.sh "${ARCH}" "${RELEASE_TAG}"

      - name: Upload promote outputs
        uses: actions/upload-artifact@v4
        if: steps.release.outputs.tag != '' && always()
        with:
          name: airgap-platform-promote-${{ matrix.arch }}-${{ steps.release.outputs.tag }}
          path: |
            dist/airgap-platform.${{ matrix.arch }}.promote.source.ref
            dist/airgap-platform.${{ matrix.arch }}.promote.digest.ref
            dist/airgap-platform.${{ matrix.arch }}.promote.target.ref
          if-no-files-found: warn
