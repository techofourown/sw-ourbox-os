name: Airgap Platform Promote Release

on:
  workflow_run:
    workflows: ["Airgap Platform"]
    types: [completed]
  release:
    types: [published]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: airgap-platform-promote-release
  cancel-in-progress: false

jobs:
  promote:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - name: Checkout candidate revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout release tag
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve promotion context
        id: context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTION_CONTEXT: versioned
          CANDIDATE_WORKFLOW_NAME: Airgap Platform
        run: |
          set -euo pipefail

          resolve_source_commit() {
            local release_ref="$1"
            local commit subject

            commit="$(git rev-parse "${release_ref}^{commit}" 2>/dev/null)" \
              || {
                echo "Unable to resolve commit for release ref ${release_ref}" >&2
                exit 1
              }
            subject="$(git log -1 --format=%s "${commit}" 2>/dev/null || true)"

            if [[ "${subject}" == chore\(release\):* ]]; then
              git rev-parse "${commit}^" 2>/dev/null \
                || {
                  echo "Unable to resolve source commit behind release commit ${commit}" >&2
                  exit 1
                }
            else
              printf '%s\n' "${commit}"
            fi
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            source_commit="${{ github.event.workflow_run.head_sha }}"
            candidate_run_id="${{ github.event.workflow_run.id }}"
            if release_tag="$(./tools/resolve-promotable-release.sh "${PROMOTION_CONTEXT}" "${source_commit}")"; then
              :
            else
              status=$?
              if [[ "${status}" -eq 3 ]]; then
                echo "No published release authorization yet for source commit ${source_commit}; skipping."
                echo "skip=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              exit "${status}"
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            if [[ "${{ github.event.release.draft }}" == "true" || "${{ github.event.release.prerelease }}" == "true" ]]; then
              echo "Release ${GITHUB_REF_NAME} is not a versioned published authorization; skipping."
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            release_tag="${{ github.event.release.tag_name }}"
            source_commit="$(resolve_source_commit "refs/tags/${release_tag}")"

            if candidate_run_id="$(./tools/find-successful-candidate-run.sh "${CANDIDATE_WORKFLOW_NAME}" "${source_commit}")"; then
              :
            else
              status=$?
              if [[ "${status}" -eq 3 ]]; then
                echo "No successful candidate run yet for source commit ${source_commit}; skipping."
                echo "skip=true" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              exit "${status}"
            fi
          else
            echo "Unsupported event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"
          echo "candidate_run_id=${candidate_run_id}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Download candidate provenance
        if: steps.context.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: airgap-platform-${{ matrix.arch }}-${{ steps.context.outputs.candidate_run_id }}
          path: dist/candidate-provenance/${{ matrix.arch }}
          run-id: ${{ steps.context.outputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote candidate digest into release tag
        if: steps.context.outputs.skip != 'true'
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          set -euo pipefail
          source_ref_file="$(find "dist/candidate-provenance/${ARCH}" -type f -name "airgap-platform.${ARCH}.ref" | head -n1 || true)"
          [[ -f "${source_ref_file}" ]] || {
            echo "Missing airgap-platform.${ARCH}.ref in downloaded candidate provenance" >&2
            exit 1
          }
          export PROMOTE_SOURCE_REF="$(cat "${source_ref_file}")"
          export PROMOTE_SOURCE_PINNED_REF="${PROMOTE_SOURCE_REF}"
          ./tools/airgap-platform/promote.sh "${ARCH}" "${RELEASE_TAG}"

      - name: Upload promote outputs
        uses: actions/upload-artifact@v4
        if: steps.context.outputs.skip != 'true' && always()
        with:
          name: airgap-platform-promote-${{ matrix.arch }}-${{ steps.context.outputs.release_tag }}
          path: |
            dist/airgap-platform.${{ matrix.arch }}.promote.source.ref
            dist/airgap-platform.${{ matrix.arch }}.promote.digest.ref
            dist/airgap-platform.${{ matrix.arch }}.promote.target.ref
          if-no-files-found: warn
