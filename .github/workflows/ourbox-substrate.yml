name: OurBox Substrate

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - 'records/**'
      - 'types/**'
      - 'generated/requirements/SyRS-*.md'
      - 'generated/requirements/SRS-*.md'
      - 'generated/requirements/OurBox-OS-Requirements-Omnibus.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 3 * * *'
  workflow_run:
    workflows: ["OurBox Substrate Recovery Request"]
    types: [completed]
permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ourbox-substrate-${{ github.event_name }}-${{ github.event.workflow_run.id || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  context:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.context.outputs.channel }}
      immutable_tag: ${{ steps.context.outputs.immutable_tag }}
    steps:
      - name: Resolve publication context
        id: context
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            stamp="$(date -u +'%Y%m%d%H%M%S')"
            echo "channel=nightly" >> "${GITHUB_OUTPUT}"
            echo "immutable_tag=nightly-${stamp}-${short_sha}" >> "${GITHUB_OUTPUT}"
          else
            echo "channel=beta" >> "${GITHUB_OUTPUT}"
            echo "immutable_tag=main-${short_sha}" >> "${GITHUB_OUTPUT}"
          fi

  recovery-request:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.request.outputs.channel }}
      immutable_tag: ${{ steps.request.outputs.immutable_tag }}
      pinned_ref: ${{ steps.contract.outputs.pinned_ref }}
    steps:
      - name: Download recovery request
        uses: actions/download-artifact@v4
        with:
          name: ourbox-substrate-recovery-${{ github.event.workflow_run.id }}
          path: dist/recovery-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load recovery request context
        id: request
        run: |
          set -euo pipefail

          request_file="$(find dist/recovery-request -type f -name 'recovery-request.env' | head -n1 || true)"
          [[ -f "${request_file}" ]] || {
            echo "Missing recovery-request.env in downloaded recovery request artifact" >&2
            exit 1
          }

          # shellcheck disable=SC1090
          source "${request_file}"

          [[ -n "${CHANNEL:-}" ]] || {
            echo "Recovery request did not declare CHANNEL" >&2
            exit 1
          }
          [[ -n "${IMMUTABLE_TAG:-}" ]] || {
            echo "Recovery request did not declare IMMUTABLE_TAG" >&2
            exit 1
          }

          echo "channel=${CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "immutable_tag=${IMMUTABLE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Validate recovery contract inputs
        id: contract
        run: |
          set -euo pipefail

          request_file="$(find dist/recovery-request -type f -name 'recovery-request.env' | head -n1 || true)"
          [[ -f "${request_file}" ]] || {
            echo "Missing recovery-request.env in downloaded recovery request artifact" >&2
            exit 1
          }

          # shellcheck disable=SC1090
          source "${request_file}"

          [[ -n "${PLATFORM_CONTRACT_REF}" ]] || {
            echo "Recovery request requires PLATFORM_CONTRACT_REF" >&2
            exit 1
          }
          [[ "${PLATFORM_CONTRACT_REF}" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "platform_contract_ref must be digest-pinned" >&2
            exit 1
          }
          echo "pinned_ref=${PLATFORM_CONTRACT_REF}" >> "${GITHUB_OUTPUT}"

  resolve-inputs:
    needs: context
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      pinned_ref: ${{ steps.resolve.outputs.pinned_ref }}
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve platform-contract from channel tags
        id: resolve
        run: |
          set -euo pipefail
          contract_repo="ghcr.io/techofourown/sw-ourbox-os/platform-contract"
          digest="$(oras resolve "${contract_repo}:edge")"
          pinned_ref="${contract_repo}@${digest}"

          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "platform-contract :edge did not resolve to a valid digest: ${digest}" >&2
            exit 1
          }

          echo "pinned_ref=${pinned_ref}" >> "${GITHUB_OUTPUT}"
          mkdir -p dist
          printf '%s\n' "${pinned_ref}" > dist/platform-contract.ref

      - name: Upload platform-contract ref for promote workflow
        uses: actions/upload-artifact@v4
        with:
          name: platform-contract-for-substrate-${{ github.run_id }}
          path: dist/platform-contract.ref
          if-no-files-found: error

  publish:
    needs: [context, recovery-request, resolve-inputs]
    if: >
      always() &&
      (
        (github.event_name == 'workflow_run' && needs.recovery-request.result == 'success') ||
        (github.event_name != 'workflow_run' &&
         needs.context.result == 'success' &&
         needs.resolve-inputs.result == 'success')
      )
    runs-on: [self-hosted, official-heavy, airgap-builder]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable candidate bundle
        env:
          ARCH: ${{ matrix.arch }}
          CONTAINER_CLI: podman
          IMMUTABLE_TAG: ${{ needs.context.outputs.immutable_tag || needs.recovery-request.outputs.immutable_tag }}
          OURBOX_PLATFORM_CONTRACT_REF: ${{ needs.resolve-inputs.outputs.pinned_ref || needs.recovery-request.outputs.pinned_ref }}
        run: |
          set -euo pipefail
          TAG="${IMMUTABLE_TAG}" \
            ARCH="${ARCH}" \
            ./tools/ourbox-substrate/publish.sh "${ARCH}" "${IMMUTABLE_TAG}"

      - name: Tag official channel from candidate digest
        env:
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ needs.context.outputs.channel || needs.recovery-request.outputs.channel }}
        run: |
          set -euo pipefail
          REF_FILE="dist/ourbox-substrate.${ARCH}.ref"
          [[ -f "${REF_FILE}" ]] || {
            echo "Missing ${REF_FILE}" >&2
            exit 1
          }
          oras tag "$(cat "${REF_FILE}")" "${CHANNEL}-${ARCH}" >/dev/null

      - name: Update official substrate catalog
        env:
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ needs.context.outputs.channel || needs.recovery-request.outputs.channel }}
        run: |
          set -euo pipefail
          ./tools/ourbox-substrate/update-catalog.sh \
            "dist/ourbox-substrate.${ARCH}.publish-record.json" \
            "${CHANNEL}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ needs.context.outputs.immutable_tag || needs.recovery-request.outputs.immutable_tag }}-${ARCH}"

      - name: Smoke pull published digest and verify layout
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          REF_FILE="dist/ourbox-substrate.${ARCH}.ref"
          if [[ ! -f "${REF_FILE}" ]]; then
            echo "No ${REF_FILE} found (publish may have been skipped)."
            exit 0
          fi

          REF="$(cat "${REF_FILE}")"
          echo "Smoke pull: ${REF}"

          rm -rf /tmp/ourbox-substrate
          mkdir -p /tmp/ourbox-substrate
          oras pull "${REF}" -o /tmp/ourbox-substrate

          test -f /tmp/ourbox-substrate/dist/ourbox-substrate.tar.gz

          TAR_LIST="/tmp/ourbox-substrate/tar.list"
          tar -tzf /tmp/ourbox-substrate/dist/ourbox-substrate.tar.gz > "${TAR_LIST}"

          echo "Tar listing (head):"
          sed -n '1,50p' "${TAR_LIST}"

          grep -q '^k3s/k3s$' "${TAR_LIST}"
          grep -q '^k3s/k3s-images-'"${ARCH}"'\.tar$' "${TAR_LIST}"
          grep -q '^manifest.env$' "${TAR_LIST}"
          grep -q '^platform/images/' "${TAR_LIST}"
          if grep -q '^platform/catalog\.json$' "${TAR_LIST}"; then
            echo "substrate bundle must not include platform/catalog.json" >&2
            exit 1
          fi
          if grep -q '^platform/selected-apps\.json$' "${TAR_LIST}"; then
            echo "substrate bundle must not include platform/selected-apps.json" >&2
            exit 1
          fi


      - name: Upload publish outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ourbox-substrate-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            dist/ourbox-substrate.${{ matrix.arch }}.ref
            dist/ourbox-substrate.${{ matrix.arch }}.push.log
            dist/ourbox-substrate.meta.env
            dist/ourbox-substrate.${{ matrix.arch }}.publish-record.json
          if-no-files-found: warn
