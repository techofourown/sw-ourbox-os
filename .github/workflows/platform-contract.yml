name: Platform Contract

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-contract-${{ github.ref_type }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish edge
        if: github.ref == 'refs/heads/main'
        run: ./tools/platform-contract/publish.sh edge

      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./tools/platform-contract/publish.sh "${GITHUB_REF_NAME}"

      - name: Smoke pull published digest and verify layout
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f dist/platform-contract.ref ]; then
            echo "No dist/platform-contract.ref found (publish may have been skipped)."
            exit 0
          fi

          REF="$(cat dist/platform-contract.ref)"
          echo "Smoke pull: ${REF}"

          rm -rf /tmp/platform-contract
          mkdir -p /tmp/platform-contract
          oras pull "${REF}" -o /tmp/platform-contract

          test -f /tmp/platform-contract/dist/platform-contract.tar.gz

          echo "Tar listing (head):"
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | head -n 50

          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/contract\.env$'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/manifests/'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/landing/'

      - name: Upload publish outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-contract-publish-${{ github.run_id }}
          path: |
            dist/platform-contract.ref
            dist/platform-contract.push.log
          if-no-files-found: warn
