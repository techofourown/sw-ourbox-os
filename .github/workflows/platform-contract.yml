name: Platform Contract

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish edge
        if: startsWith(github.ref, 'refs/heads/')
        run: ./tools/platform-contract/publish.sh edge

      - name: Publish version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./tools/platform-contract/publish.sh "${GITHUB_REF_NAME}"
