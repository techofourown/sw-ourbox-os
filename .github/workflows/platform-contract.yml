name: Platform Contract

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - 'records/**'
      - 'types/**'
      - 'SyRS-*.md'
      - 'SRS-*.md'
      - 'OurBox-OS-Requirements-Omnibus.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'package.json'
      - 'package-lock.json'
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-contract-${{ github.event_name }}-${{ github.ref_name || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Validate platform-contract render + lint
        run: bash tools/platform-contract/validate.sh

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve publish tag
        id: resolve-tag
        run: |
          set -euo pipefail

          TAG=edge
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish platform-contract bundle
        run: |
          set -euo pipefail
          ./tools/platform-contract/publish.sh "${{ steps.resolve-tag.outputs.tag }}"

      - name: Smoke pull published digest and verify layout
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f dist/platform-contract.ref ]; then
            echo "No dist/platform-contract.ref found (publish may have been skipped)."
            exit 0
          fi

          REF="$(cat dist/platform-contract.ref)"
          echo "Smoke pull: ${REF}"

          rm -rf /tmp/platform-contract
          mkdir -p /tmp/platform-contract
          oras pull "${REF}" -o /tmp/platform-contract

          test -f /tmp/platform-contract/dist/platform-contract.tar.gz

          echo "Tar listing (head):"
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | head -n 50

          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/contract\.env$'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/manifests/'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/rendered/defaults/demo-apps/manifests/'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/tools/check-target-prereqs\.sh$'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/tools/contract-identity\.sh$'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/tools/render-contract\.py$'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/tools/verify-runtime\.sh$'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/tools/verify-persistence\.sh$'
          tar -tzf /tmp/platform-contract/dist/platform-contract.tar.gz | grep -q '^platform-contract/profiles/demo-apps/images\.lock\.json$'

      - name: Upload publish outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-contract-publish-${{ github.run_id }}
          path: |
            dist/platform-contract.ref
            dist/platform-contract.push.log
          if-no-files-found: warn
