name: Platform Contract

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - 'records/**'
      - 'types/**'
      - 'generated/requirements/SyRS-*.md'
      - 'generated/requirements/SRS-*.md'
      - 'generated/requirements/OurBox-OS-Requirements-Omnibus.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-contract-${{ github.event_name }}-${{ github.ref_name || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install platform-contract validation deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Validate platform-contract render + lint
        run: bash tools/platform-contract/validate.sh

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish platform-contract bundle
        run: |
          set -euo pipefail
          ./tools/platform-contract/publish.sh edge

      - name: Smoke pull published digest and verify layout
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f dist/platform-contract.ref ]; then
            echo "No dist/platform-contract.ref found (publish may have been skipped)."
            exit 0
          fi

          REF="$(cat dist/platform-contract.ref)"
          echo "Smoke pull: ${REF}"

          rm -rf /tmp/platform-contract
          mkdir -p /tmp/platform-contract
          oras pull "${REF}" -o /tmp/platform-contract

          TAR_FILE=/tmp/platform-contract/dist/platform-contract.tar.gz
          TAR_LIST="$(mktemp)"
          trap 'rm -f "${TAR_LIST}"' EXIT

          test -f "${TAR_FILE}"
          tar -tzf "${TAR_FILE}" > "${TAR_LIST}"

          echo "Tar listing (head):"
          sed -n '1,50p' "${TAR_LIST}"

          grep -q '^platform-contract/manifests/' "${TAR_LIST}"
          grep -q '^platform-contract/rendered/defaults/demo-apps/manifests/' "${TAR_LIST}"
          grep -q '^platform-contract/tools/check-target-prereqs\.sh$' "${TAR_LIST}"
          grep -q '^platform-contract/tools/contract-identity\.sh$' "${TAR_LIST}"
          grep -q '^platform-contract/tools/render-contract\.py$' "${TAR_LIST}"
          grep -q '^platform-contract/tools/resolve-image-sources\.py$' "${TAR_LIST}"
          grep -q '^platform-contract/tools/verify-runtime\.sh$' "${TAR_LIST}"
          grep -q '^platform-contract/tools/verify-persistence\.sh$' "${TAR_LIST}"
          grep -q '^platform-contract/profiles/demo-apps/image-sources\.json$' "${TAR_LIST}"
          grep -q '^platform-contract/profiles/demo-apps/platform-image-sources\.json$' "${TAR_LIST}"
          grep -q '^platform-contract/rendered/defaults/demo-apps/images\.lock\.json$' "${TAR_LIST}"

      - name: Upload publish outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-contract-publish-${{ github.run_id }}
          path: |
            dist/platform-contract.ref
            dist/platform-contract.push.log
            dist/platform-contract.publish-record.json
          if-no-files-found: warn
