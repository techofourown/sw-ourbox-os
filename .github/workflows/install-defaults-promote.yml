name: Install Defaults Promote Stable

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: install-defaults-promote-stable-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  promote:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote tag
        run: |
          set -euo pipefail

          REF_BASE="ghcr.io/techofourown/sw-ourbox-os/install-defaults"
          SOURCE_TAG="${{ github.event.release.tag_name }}"
          TARGET_TAG="stable"

          wait_for_digest() {
            local source_ref="$1"
            local timeout="${PROMOTE_WAIT_TIMEOUT_SECONDS:-1800}"
            local interval="${PROMOTE_WAIT_INTERVAL_SECONDS:-15}"
            local elapsed=0
            local digest=""

            while (( elapsed <= timeout )); do
              digest="$(oras resolve "${source_ref}" 2>/dev/null || true)"
              if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "${digest}"
                return 0
              fi
              if (( elapsed == 0 )); then
                echo "Waiting for publish workflow to make ${source_ref} available..."
              fi
              sleep "${interval}"
              elapsed=$((elapsed + interval))
            done

            return 1
          }

          # shellcheck disable=SC1091
          source ./release/install-defaults-stable.env
          MATCHBOX_REF="${MATCHBOX_OS_DEFAULT_REF_OVERRIDE:-}"
          WOODBOX_REF="${WOODBOX_OS_DEFAULT_REF_OVERRIDE:-}"
          TINDERBOX_REF="${TINDERBOX_OS_DEFAULT_REF_OVERRIDE:-}"

          mkdir -p dist

          if [[ -n "${MATCHBOX_REF}" || -n "${WOODBOX_REF}" || -n "${TINDERBOX_REF}" ]]; then
            TAG="${TARGET_TAG}" \
            MATCHBOX_OS_DEFAULT_REF_OVERRIDE="${MATCHBOX_REF}" \
            WOODBOX_OS_DEFAULT_REF_OVERRIDE="${WOODBOX_REF}" \
            TINDERBOX_OS_DEFAULT_REF_OVERRIDE="${TINDERBOX_REF}" \
              ./tools/install-defaults/publish.sh "${TARGET_TAG}"

            printf '%s\n' "curated-build" > dist/install-defaults.promote.mode
            printf '%s\n' "refs/tags/${SOURCE_TAG}" > dist/install-defaults.promote.source.ref
            printf '%s\n' "$(cat dist/install-defaults.ref)" > dist/install-defaults.promote.digest.ref
            printf '%s\n' "${REF_BASE}:${TARGET_TAG}" > dist/install-defaults.promote.target.ref

            echo "Published curated ${REF_BASE}:${TARGET_TAG} from release tag ${SOURCE_TAG}."
            exit 0
          fi

          SOURCE_REF="${REF_BASE}:${SOURCE_TAG}"
          DIGEST="$(wait_for_digest "${SOURCE_REF}" || true)"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Timed out waiting for ${SOURCE_REF} to be published" >&2
            exit 1
          }

          SOURCE_PINNED="${REF_BASE}@${DIGEST}"
          oras tag "${SOURCE_PINNED}" "${TARGET_TAG}"

          printf '%s\n' "retag" > dist/install-defaults.promote.mode
          printf '%s\n' "${SOURCE_REF}" > dist/install-defaults.promote.source.ref
          printf '%s\n' "${SOURCE_PINNED}" > dist/install-defaults.promote.digest.ref
          printf '%s\n' "${REF_BASE}:${TARGET_TAG}" > dist/install-defaults.promote.target.ref

          echo "Promoted ${SOURCE_REF} (${DIGEST}) -> ${REF_BASE}:${TARGET_TAG}"

      - name: Upload promote outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-defaults-promote-${{ github.event.release.tag_name || github.run_id }}
          path: |
            dist/install-defaults.promote.mode
            dist/install-defaults.promote.source.ref
            dist/install-defaults.promote.digest.ref
            dist/install-defaults.promote.target.ref
          if-no-files-found: warn
