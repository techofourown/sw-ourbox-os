name: Install Defaults

on:
  push:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: install-defaults-${{ github.event_name }}-${{ github.ref_name || github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve publish tag
        id: resolve-tag
        run: |
          set -euo pipefail

          TAG=edge
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish install-defaults bundle
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve-tag.outputs.tag }}" ./tools/install-defaults/publish.sh "${{ steps.resolve-tag.outputs.tag }}"

      - name: Smoke pull published digest and verify layout
        if: always()
        run: |
          set -euo pipefail

          REF_FILE="dist/install-defaults.ref"
          if [[ ! -f "${REF_FILE}" ]]; then
            echo "No ${REF_FILE} found (publish may have been skipped)."
            exit 0
          fi

          REF="$(cat "${REF_FILE}")"
          echo "Smoke pull: ${REF}"

          rm -rf /tmp/install-defaults
          mkdir -p /tmp/install-defaults
          oras pull "${REF}" -o /tmp/install-defaults

          test -f /tmp/install-defaults/dist/install-defaults.tar.gz

          TAR_LIST="/tmp/install-defaults/tar.list"
          tar -tzf /tmp/install-defaults/dist/install-defaults.tar.gz > "${TAR_LIST}"

          echo "Tar listing (head):"
          sed -n '1,50p' "${TAR_LIST}"

          grep -q '^install-defaults/schema\.env$' "${TAR_LIST}"
          grep -q '^install-defaults/manifest\.env$' "${TAR_LIST}"
          grep -q '^install-defaults/defaults/matchbox\.env$' "${TAR_LIST}"

      - name: Upload publish outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-defaults-${{ github.run_id }}
          path: |
            dist/install-defaults.ref
            dist/install-defaults.push.log
          if-no-files-found: warn
