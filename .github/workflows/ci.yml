name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  sanitization:
    name: Public repo sanitization check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden content
        run: bash tools/policy/check-public-sanitization.sh

  workflow-safety:
    name: Workflow trust boundary check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows
        uses: rhysd/actionlint@v1

      - name: Check workflow trust boundaries
        run: bash tools/policy/check-workflow-safety.sh

  platform-contract:
    name: Platform contract render + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install platform-contract validation deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate rendered platform contract
        run: bash tools/platform-contract/validate.sh

      - name: Run render-contract negative tests
        run: bash tools/platform-contract/test-render-contract-negative.sh

      - name: Run verify-runtime smoke
        run: bash tools/platform-contract/check-verify-runtime-smoke.sh

      - name: Run platform-contract promote tests
        run: bash tools/platform-contract/test-promote.sh

  approved-upstream-inputs:
    name: Approved upstream input snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (deterministic)
        run: npm ci

      - name: Validate schemas
        run: npm run validate:schemas

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Run approved upstream input validator tests
        run: bash tools/approved-upstream-inputs/test-validate.sh

      - name: Validate approved upstream inputs
        run: python3 tools/approved-upstream-inputs/validate.py --approved-inputs release/approved-upstream-inputs.json

  installer-selection:
    name: Installer selection resolver tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate install-defaults source data
        run: bash tools/install-defaults/validate-assignment-only.sh

      - name: Run installer-selection resolver tests
        run: bash tools/install-defaults/test-installer-selection-resolver.sh

  installer-ssh:
    name: Installer SSH helper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer SSH helper shell syntax
        run: bash -n tools/installer-ssh-helper.sh tools/test-installer-ssh-helper.sh

      - name: Shellcheck installer SSH helper
        run: shellcheck tools/installer-ssh-helper.sh tools/test-installer-ssh-helper.sh

      - name: Run installer SSH helper tests
        run: bash tools/test-installer-ssh-helper.sh

  release-control:
    name: Release-control module tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run release-control tests
        run: python3 -m unittest discover -s tools/release-control/tests -p 'test_*.py'

  pr-batch-big-picture:
    name: PR batch comparison tool tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PR batch comparison tool tests
        run: python3 tools/test_pr_batch_big_picture.py

  graphmd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # IMPORTANT: do NOT enable built-in npm caching here.
      # setup-node cache fails immediately if lockfile is missing.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assert validator range policy (<1.0.0)
        run: |
          set -euo pipefail
          RANGE=$(node -p "require('./package.json').devDependencies['@graphmd/dataset'] || ''")
          if [ "$RANGE" != "<1.0.0" ] && [ "$RANGE" != "<1" ]; then
            echo "FATAL: @graphmd/dataset must track latest validator releases via <1.0.0."
            echo "Found: $RANGE"
            exit 1
          fi

      - name: Fail if package-lock.json missing
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "FATAL: package-lock.json is missing at repo root."
            echo "Run: npm install"
            echo "Then commit package-lock.json."
            exit 1
          fi

      - name: Fail if @graphmd/dataset lock is not latest satisfying declared range
        run: |
          set -euo pipefail
          REG='https://registry.npmjs.org'

          RANGE=$(node -p "require('./package.json').devDependencies['@graphmd/dataset'] || ''")
          if [ -z "$RANGE" ]; then
            echo "FATAL: package.json missing devDependency @graphmd/dataset."
            exit 1
          fi
          echo "Declared range: ${RANGE}"

          LATEST=$(npm view "@graphmd/dataset@${RANGE}" version --registry="$REG" --json \
            | node -p "const fs=require('fs'); const v=JSON.parse(fs.readFileSync(0,'utf8')); Array.isArray(v)?v[v.length-1]:v")
          echo "Latest in range: ${LATEST}"

          LOCKED=$(node -p "require('./package-lock.json').packages?.['node_modules/@graphmd/dataset']?.version || require('./package-lock.json').dependencies?.['@graphmd/dataset']?.version || ''")
          if [ -z "$LOCKED" ]; then
            echo "FATAL: package-lock.json does not include @graphmd/dataset."
            echo "Fix: rm -rf node_modules package-lock.json && npm install"
            exit 1
          fi
          echo "Locked: ${LOCKED}"

          if [ "$LOCKED" != "$LATEST" ]; then
            echo "FATAL: validator lockfile is stale."
            echo "Locked: $LOCKED"
            echo "Latest:  $LATEST"
            echo ""
            echo "Fix:"
            echo "  rm -rf node_modules package-lock.json"
            echo "  npm install"
            echo "  git add package-lock.json"
            exit 1
          fi

      - name: Install deps (deterministic)
        run: npm ci

      - name: Validate dataset + build requirements artifacts
        run: npm test

      - name: Verify compiled spec outputs and omnibus index coverage
        run: npm run verify:spec-artifacts

      - name: Fail if generated requirements artifacts appear at repo root
        run: |
          set -euo pipefail
          BAD=$(find . -maxdepth 1 -type f | sed "s#^./##" | rg "^(SRS-.*\.md|SyRS-.*\.md|OurBox-OS-Requirements-Omnibus\.md)$" || true)
          if [ -n "${BAD}" ]; then
            echo "Generated requirements artifacts must not be at repo root:" >&2
            echo "${BAD}" >&2
            exit 1
          fi

      - name: Mint org-bot token
        id: app-token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SEMREL_APP_ID }}
          private-key: ${{ secrets.SEMREL_APP_PRIVATE_KEY }}

      - name: Open PR for new compiled spec artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW_FILES=$(git ls-files --others --exclude-standard -- 'generated/requirements/SRS-*.md' 'generated/requirements/SyRS-*.md' 2>/dev/null || true)
          if [ -z "$NEW_FILES" ]; then
            echo "No new compiled spec artifacts to commit."
            exit 0
          fi
          echo "New compiled spec files:"
          echo "$NEW_FILES"
          BRANCH="ci/compiled-specs-${GITHUB_SHA::8}"
          git checkout -b "$BRANCH"
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@martynus.net"
          echo "$NEW_FILES" | xargs git add --
          git add generated/requirements/OurBox-OS-Requirements-Omnibus.md
          git commit -m "$(printf 'chore: add compiled spec artifacts for new specs\n\nCommitted by CI for specs that did not previously exist in the\nrepository. Triggered by %s.' "${GITHUB_SHA::12}")"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "chore: add compiled spec artifacts for new specs" \
            --body "$(printf 'Compiled spec files for specs that did not previously exist in the\nrepository. Opened by CI after merging %s.' "${GITHUB_SHA::12}")" \
            --base main \
            --head "$BRANCH")
          echo "Opened: $PR_URL"
          GH_TOKEN="$APP_TOKEN" gh pr merge "$PR_URL" --auto --merge

      - name: Upload rendered requirements artifacts
        uses: actions/upload-artifact@v4
        with:
          name: requirements-artifacts
          path: |
            generated/requirements/OurBox-OS-Requirements-Omnibus.md
            generated/requirements/SyRS-*.md
            generated/requirements/SRS-*.md
            docs/00-Glossary/Terms-and-Definitions.md
            docs/architecture/AD-0001-ourbox-os-architecture-description.md
