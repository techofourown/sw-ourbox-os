name: Airgap Platform

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (edge, stable, vX.Y.Z, etc.)
        required: false
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: airgap-platform-${{ github.event_name }}-${{ github.ref_name || github.event.release.tag_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU (multi-arch pulls)
        uses: docker/setup-qemu-action@v3

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve publish tag
        id: resolve-tag
        run: |
          set -euo pipefail

          TAG=edge
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          TAG="${TAG}" ARCH="${ARCH}" ./tools/airgap-platform/publish.sh "${ARCH}" "${TAG}"

      - name: Smoke pull published digest and verify layout
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          REF_FILE="dist/airgap-platform.${ARCH}.ref"
          if [[ ! -f "${REF_FILE}" ]]; then
            echo "No ${REF_FILE} found (publish may have been skipped)."
            exit 0
          fi

          REF="$(cat "${REF_FILE}")"
          echo "Smoke pull: ${REF}"

          rm -rf /tmp/airgap-platform
          mkdir -p /tmp/airgap-platform
          oras pull "${REF}" -o /tmp/airgap-platform

          test -f /tmp/airgap-platform/dist/airgap-platform.tar.gz

          TAR_LIST="/tmp/airgap-platform/tar.list"
          tar -tzf /tmp/airgap-platform/dist/airgap-platform.tar.gz > "${TAR_LIST}"

          echo "Tar listing (head):"
          sed -n '1,50p' "${TAR_LIST}"

          grep -q '^k3s/k3s$' "${TAR_LIST}"
          grep -q '^k3s/k3s-airgap-images-'${ARCH}'\.tar$' "${TAR_LIST}"
          grep -q '^manifest.env$' "${TAR_LIST}"
          grep -q '^platform/images/' "${TAR_LIST}"

      - name: Upload publish outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgap-platform-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            dist/airgap-platform.${{ matrix.arch }}.ref
            dist/airgap-platform.${{ matrix.arch }}.push.log
          if-no-files-found: warn
