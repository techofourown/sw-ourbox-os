name: Airgap Platform

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - 'records/**'
      - 'types/**'
      - 'generated/requirements/SyRS-*.md'
      - 'generated/requirements/SRS-*.md'
      - 'generated/requirements/OurBox-OS-Requirements-Omnibus.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      platform_contract_ref:
        description: Optional digest-pinned platform-contract ref for publish-only recovery
        required: false
        type: string
      platform_contract_digest:
        description: Optional platform-contract digest for publish-only recovery
        required: false
        type: string
      application_catalog_ref:
        description: Optional digest-pinned application catalog bundle ref override
        required: false
        type: string
      immutable_tag:
        description: Optional immutable airgap-platform tag override
        required: false
        type: string
      channel:
        description: Optional channel override for the published airgap bundle
        required: false
        type: string
permissions:
  contents: read
  packages: write

concurrency:
  group: airgap-platform-${{ github.event_name }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.context.outputs.channel }}
      immutable_tag: ${{ steps.context.outputs.immutable_tag }}
      platform_contract_tag: ${{ steps.context.outputs.platform_contract_tag }}
    steps:
      - name: Resolve publication context
        id: context
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_IMMUTABLE_TAG: ${{ github.event.inputs.immutable_tag }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            stamp="$(date -u +'%Y%m%d%H%M%S')"
            echo "channel=nightly" >> "${GITHUB_OUTPUT}"
            echo "immutable_tag=nightly-${stamp}-${short_sha}" >> "${GITHUB_OUTPUT}"
            echo "platform_contract_tag=nightly-${stamp}-${short_sha}" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            stamp="$(date -u +'%Y%m%d%H%M%S')"
            channel="${INPUT_CHANNEL:-beta}"
            immutable_tag="${INPUT_IMMUTABLE_TAG:-manual-${stamp}-${short_sha}}"
            echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
            echo "immutable_tag=${immutable_tag}" >> "${GITHUB_OUTPUT}"
            echo "platform_contract_tag=${immutable_tag}" >> "${GITHUB_OUTPUT}"
          else
            echo "channel=beta" >> "${GITHUB_OUTPUT}"
            echo "immutable_tag=main-${short_sha}" >> "${GITHUB_OUTPUT}"
            echo "platform_contract_tag=main-${short_sha}" >> "${GITHUB_OUTPUT}"
          fi

  reuse-platform-contract:
    needs: context
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform_contract_ref != '' || inputs.platform_contract_digest != '' || inputs.application_catalog_ref != '') }}
    runs-on: ubuntu-latest
    outputs:
      catalog_pinned_ref: ${{ steps.contract.outputs.catalog_pinned_ref }}
      pinned_ref: ${{ steps.contract.outputs.pinned_ref }}
      digest: ${{ steps.contract.outputs.digest }}
    steps:
      - name: Validate manual platform-contract recovery inputs
        id: contract
        env:
          PLATFORM_CONTRACT_REF: ${{ inputs.platform_contract_ref }}
          PLATFORM_CONTRACT_DIGEST: ${{ inputs.platform_contract_digest }}
          APPLICATION_CATALOG_REF: ${{ inputs.application_catalog_ref }}
        run: |
          set -euo pipefail

          [[ -n "${PLATFORM_CONTRACT_REF}" ]] || {
            echo "workflow_dispatch recovery requires platform_contract_ref" >&2
            exit 1
          }
          [[ -n "${PLATFORM_CONTRACT_DIGEST}" ]] || {
            echo "workflow_dispatch recovery requires platform_contract_digest" >&2
            exit 1
          }
          [[ "${PLATFORM_CONTRACT_REF}" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "platform_contract_ref must be digest-pinned" >&2
            exit 1
          }
          [[ "${PLATFORM_CONTRACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "platform_contract_digest must be a sha256 digest" >&2
            exit 1
          }
          [[ "${PLATFORM_CONTRACT_REF##*@}" == "${PLATFORM_CONTRACT_DIGEST}" ]] || {
            echo "platform_contract_ref and platform_contract_digest do not match" >&2
            exit 1
          }
          if [[ -n "${APPLICATION_CATALOG_REF}" ]] && [[ ! "${APPLICATION_CATALOG_REF}" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "application_catalog_ref must be digest-pinned when provided" >&2
            exit 1
          fi

          echo "pinned_ref=${PLATFORM_CONTRACT_REF}" >> "${GITHUB_OUTPUT}"
          echo "digest=${PLATFORM_CONTRACT_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "catalog_pinned_ref=${APPLICATION_CATALOG_REF}" >> "${GITHUB_OUTPUT}"

  publish-platform-contract:
    needs: context
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.platform_contract_ref == '' && inputs.platform_contract_digest == '' && inputs.application_catalog_ref == '') }}
    runs-on: ubuntu-latest
    outputs:
      catalog_pinned_ref: ${{ steps.catalog.outputs.pinned_ref }}
      pinned_ref: ${{ steps.contract.outputs.pinned_ref }}
      digest: ${{ steps.contract.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install platform-contract build deps
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Install crane
        run: |
          set -euo pipefail
          CRANE_VERSION="v0.20.7"
          CRANE_DIR="${RUNNER_TEMP}/crane-bin"
          mkdir -p "${CRANE_DIR}"
          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C "${CRANE_DIR}" crane
          echo "${CRANE_DIR}" >> "${GITHUB_PATH}"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve application catalog bundle ref
        id: catalog
        run: |
          set -euo pipefail
          mutable_ref="ghcr.io/techofourown/sw-ourbox-catalog-demo:latest"
          digest="$(oras resolve "${mutable_ref}")"
          echo "pinned_ref=ghcr.io/techofourown/sw-ourbox-catalog-demo@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish bound platform-contract artifact
        env:
          OURBOX_APPLICATION_CATALOG_REF: ${{ steps.catalog.outputs.pinned_ref }}
        run: |
          set -euo pipefail
          ./tools/platform-contract/publish.sh "${{ needs.context.outputs.platform_contract_tag }}"

      - name: Capture platform-contract identity
        id: contract
        run: |
          set -euo pipefail
          pinned_ref="$(cat dist/platform-contract.ref)"
          digest="${pinned_ref##*@}"
          echo "pinned_ref=${pinned_ref}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload platform-contract publish outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-contract-for-airgap-${{ github.run_id }}
          path: |
            dist/platform-contract.ref
            dist/platform-contract.push.log
            dist/platform-contract.publish-record.json
          if-no-files-found: warn

  publish:
    needs: [context, reuse-platform-contract, publish-platform-contract]
    runs-on: [self-hosted, official-heavy, airgap-builder]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Select compatible application catalog bundle
        id: catalog
        env:
          EXPECTED_CONTRACT_DIGEST: ${{ needs.publish-platform-contract.outputs.digest || needs.reuse-platform-contract.outputs.digest }}
          ORIGINAL_CATALOG_PINNED_REF: ${{ needs.publish-platform-contract.outputs.catalog_pinned_ref || needs.reuse-platform-contract.outputs.catalog_pinned_ref }}
          DEFAULT_CATALOG_REPO: ghcr.io/techofourown/sw-ourbox-catalog-demo
        run: |
          set -euo pipefail

          resolve_bound_contract_digest() {
            local ref="$1" tmp pull_dir extract_dir bundle_tar manifest_file manifest_digest
            tmp="$(mktemp -d)"
            pull_dir="${tmp}/pull"
            extract_dir="${tmp}/extract"
            mkdir -p "${pull_dir}"
            oras pull "${ref}" -o "${pull_dir}" >/dev/null
            bundle_tar="$(find "${pull_dir}" -maxdepth 4 -type f -name 'application-catalog-bundle.tar.gz' | head -n1 || true)"
            [[ -f "${bundle_tar}" ]] || {
              echo "application catalog ref did not contain application-catalog-bundle.tar.gz: ${ref}" >&2
              rm -rf "${tmp}"
              return 1
            }
            mkdir -p "${extract_dir}"
            tar -xzf "${bundle_tar}" -C "${extract_dir}"
            manifest_file="${extract_dir}/manifest.env"
            [[ -f "${manifest_file}" ]] || {
              echo "application catalog bundle missing manifest.env: ${ref}" >&2
              rm -rf "${tmp}"
              return 1
            }
            manifest_digest="$(awk -F= '/^OURBOX_PLATFORM_CONTRACT_DIGEST=/{print $2; exit}' "${manifest_file}")"
            rm -rf "${tmp}"
            [[ "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "application catalog ref did not declare a valid OURBOX_PLATFORM_CONTRACT_DIGEST: ${ref}" >&2
              return 1
            }
            printf '%s\n' "${manifest_digest}"
          }

          select_catalog_ref() {
            local candidate_ref="$1" manifest_digest
            manifest_digest="$(resolve_bound_contract_digest "${candidate_ref}")" || return 1
            if [[ "${manifest_digest}" == "${EXPECTED_CONTRACT_DIGEST}" ]]; then
              echo "Using application catalog bundle ${candidate_ref} (bound=${manifest_digest})"
              echo "pinned_ref=${candidate_ref}" >> "${GITHUB_OUTPUT}"
              return 0
            fi
            echo "Skipping application catalog bundle ${candidate_ref}: bound=${manifest_digest}, expected=${EXPECTED_CONTRACT_DIGEST}" >&2
            return 1
          }

          if [[ -n "${ORIGINAL_CATALOG_PINNED_REF}" ]] && select_catalog_ref "${ORIGINAL_CATALOG_PINNED_REF}"; then
            exit 0
          fi

          catalog_repo="${ORIGINAL_CATALOG_PINNED_REF%@*}"
          if [[ -z "${catalog_repo}" || "${catalog_repo}" == "${ORIGINAL_CATALOG_PINNED_REF}" ]]; then
            catalog_repo="${DEFAULT_CATALOG_REPO}"
          fi
          mutable_ref="${catalog_repo}:latest"
          refreshed_digest="$(oras resolve "${mutable_ref}")"
          refreshed_ref="${catalog_repo}@${refreshed_digest}"

          select_catalog_ref "${refreshed_ref}" || {
            echo "No compatible application catalog bundle found for contract ${EXPECTED_CONTRACT_DIGEST}" >&2
            exit 1
          }

      - name: Publish immutable candidate bundle
        env:
          ARCH: ${{ matrix.arch }}
          CONTAINER_CLI: podman
          OURBOX_PLATFORM_CONTRACT_REF: ${{ needs.publish-platform-contract.outputs.pinned_ref || needs.reuse-platform-contract.outputs.pinned_ref }}
          OURBOX_PLATFORM_CONTRACT_DIGEST: ${{ needs.publish-platform-contract.outputs.digest || needs.reuse-platform-contract.outputs.digest }}
          OURBOX_APPLICATION_CATALOG_REF: ${{ steps.catalog.outputs.pinned_ref }}
        run: |
          set -euo pipefail
          TAG="${{ needs.context.outputs.immutable_tag }}" \
            ARCH="${ARCH}" \
            ./tools/airgap-platform/publish.sh "${ARCH}" "${{ needs.context.outputs.immutable_tag }}"

      - name: Tag official channel from candidate digest
        env:
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ needs.context.outputs.channel }}
        run: |
          set -euo pipefail
          REF_FILE="dist/airgap-platform.${ARCH}.ref"
          [[ -f "${REF_FILE}" ]] || {
            echo "Missing ${REF_FILE}" >&2
            exit 1
          }
          oras tag "$(cat "${REF_FILE}")" "${CHANNEL}-${ARCH}" >/dev/null

      - name: Update official airgap catalog
        env:
          ARCH: ${{ matrix.arch }}
          CHANNEL: ${{ needs.context.outputs.channel }}
        run: |
          set -euo pipefail
          ./tools/airgap-platform/update-catalog.sh \
            "dist/airgap-platform.${ARCH}.publish-record.json" \
            "${CHANNEL}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ needs.context.outputs.immutable_tag }}-${ARCH}"

      - name: Smoke pull published digest and verify layout
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          REF_FILE="dist/airgap-platform.${ARCH}.ref"
          if [[ ! -f "${REF_FILE}" ]]; then
            echo "No ${REF_FILE} found (publish may have been skipped)."
            exit 0
          fi

          REF="$(cat "${REF_FILE}")"
          echo "Smoke pull: ${REF}"

          rm -rf /tmp/airgap-platform
          mkdir -p /tmp/airgap-platform
          oras pull "${REF}" -o /tmp/airgap-platform

          test -f /tmp/airgap-platform/dist/airgap-platform.tar.gz

          TAR_LIST="/tmp/airgap-platform/tar.list"
          tar -tzf /tmp/airgap-platform/dist/airgap-platform.tar.gz > "${TAR_LIST}"

          echo "Tar listing (head):"
          sed -n '1,50p' "${TAR_LIST}"

          grep -q '^k3s/k3s$' "${TAR_LIST}"
          grep -q '^k3s/k3s-airgap-images-'${ARCH}'\.tar$' "${TAR_LIST}"
          grep -q '^manifest.env$' "${TAR_LIST}"
          grep -q '^platform/images/' "${TAR_LIST}"
          tar -xOzf /tmp/airgap-platform/dist/airgap-platform.tar.gz manifest.env | grep -q '^OURBOX_PLATFORM_CONTRACT_DIGEST=sha256:'

      - name: Upload publish outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airgap-platform-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            dist/airgap-platform.${{ matrix.arch }}.ref
            dist/airgap-platform.${{ matrix.arch }}.push.log
            dist/airgap-platform.meta.env
            dist/airgap-platform.${{ matrix.arch }}.publish-record.json
          if-no-files-found: warn
