name: OurBox Substrate Recovery Request

on:
  workflow_dispatch:
    inputs:
      platform_contract_ref:
        description: Digest-pinned platform-contract ref to publish from
        required: true
        type: string
      immutable_tag:
        description: Immutable ourbox-substrate tag to publish, for example main-50e9a7a6aa2c
        required: true
        type: string
      channel:
        description: Channel tag to update, for example beta or nightly
        required: false
        default: beta
        type: string

permissions:
  contents: read

concurrency:
  group: ourbox-substrate-recovery-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest

    steps:
      - name: Validate recovery request inputs
        env:
          PLATFORM_CONTRACT_REF: ${{ inputs.platform_contract_ref }}
          IMMUTABLE_TAG: ${{ inputs.immutable_tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          [[ "${PLATFORM_CONTRACT_REF}" =~ ^[^[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "platform_contract_ref must be digest-pinned" >&2
            exit 1
          }
          [[ -n "${IMMUTABLE_TAG}" ]] || {
            echo "immutable_tag is required" >&2
            exit 1
          }
          [[ -n "${CHANNEL}" ]] || {
            echo "channel is required" >&2
            exit 1
          }

      - name: Write recovery request artifact
        env:
          PLATFORM_CONTRACT_REF: ${{ inputs.platform_contract_ref }}
          IMMUTABLE_TAG: ${{ inputs.immutable_tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p dist/recovery-request
          cat > dist/recovery-request/recovery-request.env <<EOF
          PLATFORM_CONTRACT_REF=${PLATFORM_CONTRACT_REF}
          IMMUTABLE_TAG=${IMMUTABLE_TAG}
          CHANNEL=${CHANNEL}
          EOF

      - name: Upload recovery request
        uses: actions/upload-artifact@v4
        with:
          name: ourbox-substrate-recovery-${{ github.run_id }}
          path: dist/recovery-request/recovery-request.env
          if-no-files-found: error
